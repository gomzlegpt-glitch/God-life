<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 갓생살기</title>
<meta name="theme-color" content="#1d6a73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="갓생살기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 우리집 갓생살기 — 부부 각자의 공부·운동 스케줄 + 알림. 기본은 '내 스케줄'만, 상대방은 '함께 보기'. 주간 시간표 격자가 중심 */
:root{
  --bg:#f1f3f4; --surface:#ffffff; --sunk:#e8ecee; --fg:#172229; --muted:#5a6971; --line:#d9e0e3; --line2:#eef1f2;
  --accent:#1d6a73; --accent-fg:#ffffff; --accent-soft:#dcefef;
  --study:#2d5fa6; --study-soft:#e3ebf7; --ex:#2b7a4b; --ex-soft:#dcf0e2;
  --chore:#a3620d; --chore-soft:#f7ead6; --fixed:#6a767e; --fixed-soft:#e9edef;
  --warn:#b4511b; --warn-soft:#fbe7da; --shadow:0 1px 2px rgba(20,34,41,.06),0 2px 8px rgba(20,34,41,.05);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10171b; --surface:#172126; --sunk:#0c1215; --fg:#e3e9ec; --muted:#98a7af; --line:#2a373e; --line2:#1f2a30;
  --accent:#5fb3ba; --accent-fg:#0c1215; --accent-soft:#1b383b;
  --study:#8ab0ea; --study-soft:#1b2b43; --ex:#7bc998; --ex-soft:#163025;
  --chore:#e2ab5c; --chore-soft:#382a14; --fixed:#a2aeb5; --fixed-soft:#222d33;
  --warn:#f0965e; --warn-soft:#3b2316; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:1.05rem;flex:none}
h1{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.86rem}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.demo{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:9px 14px;font-size:.88rem}
.demo b{color:var(--warn)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:9px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:1.02rem;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:.86rem;margin:0;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:14px;align-items:start}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.min{background:var(--warn-soft);color:var(--warn)}
.chip.now{background:var(--accent);color:var(--accent-fg)}
.chip.ok{background:var(--ex-soft);color:var(--ex)}
.num{font-variant-numeric:tabular-nums}
.t-study{--c:var(--study);--cs:var(--study-soft)} .t-exercise{--c:var(--ex);--cs:var(--ex-soft)}
.t-chores{--c:var(--chore);--cs:var(--chore-soft)} .t-fixed{--c:var(--fixed);--cs:var(--fixed-soft)}
.kind{background:var(--cs);color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.card .stat{box-shadow:none;background:var(--bg);border:0}
.stat .k{font-size:.82rem;color:var(--muted);font-weight:600}
.stat .v{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:.85rem;color:var(--muted);font-weight:500}
@media (max-width:560px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stats .stat{padding:10px}.stats .stat .v{font-size:1.02rem}.stats .stat .v small{display:block;font-size:.74rem}.stats .stat .note{display:none}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:56px 1fr;gap:12px}
.tl .tm{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted);padding-top:10px;text-align:right}
.tl .tm b{display:block;color:var(--fg);font-size:.9rem}
.tl .bx{border-left:4px solid var(--c);background:var(--cs);border-radius:10px;padding:10px 12px;margin:4px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.tl li.fixed .bx{background:transparent;border:1px dashed var(--line);border-left:4px solid var(--fixed);padding:6px 12px;color:var(--muted)}
.tl li.fixed .tm{padding-top:6px}
.tl li.cur .bx{box-shadow:0 0 0 2px var(--accent)}
.tl .lab{font-weight:600;overflow-wrap:anywhere}
.tl li.fixed .lab{font-weight:500}
.tl li.done .lab{text-decoration:line-through;text-decoration-color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:.82rem;padding:6px 11px;cursor:pointer;min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button.skip[aria-pressed="true"]{background:var(--warn);color:#fff}
.seg button.part[aria-pressed="true"]{background:var(--chore);color:#fff}
.st{font-size:.8rem;font-weight:600}
.st.done{color:var(--ex)} .st.part{color:var(--chore)} .st.skip{color:var(--warn)} .st.none{color:var(--muted);font-weight:400}
select,input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number]{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.btn{font:inherit;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.block{width:100%;padding:11px}
.btn:disabled{opacity:.5;cursor:default}
.banner{background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.banner strong{color:var(--warn)}
.info{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.muted{color:var(--muted)}
.note{font-size:.83rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.tt{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tt-in{display:grid;grid-template-columns:42px repeat(7,minmax(74px,1fr));min-width:590px}
.tt-dh{background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);padding:7px 4px;text-align:center;font-size:.8rem;display:flex;flex-direction:column;line-height:1.25}
.tt-dh span{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.tt-dh.sun b{color:var(--warn)} .tt-dh.sat b{color:var(--study)}
.tt-dh.today{background:var(--accent-soft)} .tt-dh.today b{color:var(--accent)}
.tt-corner{border-bottom:1px solid var(--line)}
.tt-times{position:relative}
.tt-times span{position:absolute;right:6px;transform:translateY(-50%);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt-times span:first-child{transform:none}
.tt-col{position:relative;border-left:1px solid var(--line2);height:calc(var(--hours) * var(--hr));
  background-image:linear-gradient(to bottom,var(--line2) 1px,transparent 1px);background-size:100% var(--hr)}
.tt-col.today{background-color:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.tb{position:absolute;left:2px;width:calc(100% - 4px);border:0;border-radius:6px;padding:3px 5px;font:inherit;font-size:.72rem;line-height:1.25;text-align:left;overflow:hidden;
  background:var(--cs);color:var(--fg);border-left:3px solid var(--c);z-index:1;display:flex;flex-direction:column;gap:1px}
button.tb{cursor:pointer}
.tb .l{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.tb .t{color:var(--muted);font-size:.66rem;font-variant-numeric:tabular-nums}
.tb.fx{left:0;width:100%;z-index:0;border-left:0;border-radius:0;color:var(--muted);background:repeating-linear-gradient(135deg,var(--fixed-soft) 0 6px,transparent 6px 11px)}
.tb.fx .l{font-weight:500}
.tb.sel{box-shadow:0 0 0 2px var(--accent);z-index:3}
.tb[data-st]::after{position:absolute;top:2px;right:3px;font-size:.7rem;font-weight:700}
.tb[data-st="done"]::after{content:"✓";color:var(--ex)}
.tb[data-st="part"]::after{content:"½";color:var(--chore)}
.tb[data-st="skip"]::after{content:"✕";color:var(--warn)}
.tb[data-st="skip"]{opacity:.6}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--warn);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);vertical-align:-1px;margin-right:5px}
.legend .t-fixed i{background:repeating-linear-gradient(135deg,var(--fixed) 0 2px,var(--fixed-soft) 2px 4px)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
.form label.wide{grid-column:1/-1}
.daypick{display:flex;gap:5px;flex-wrap:wrap}
.daypick label{flex-direction:row;align-items:center;gap:4px;color:var(--fg);font-size:.88rem;background:var(--sunk);padding:5px 9px;border-radius:8px;cursor:pointer}
.daypick input{accent-color:var(--accent)}
table.list{width:100%;border-collapse:collapse;font-size:.88rem}
table.list th,table.list td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list th{color:var(--muted);font-weight:600;font-size:.78rem}
.tablewrap{overflow-x:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:14px}
.pick ul{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
details summary{cursor:pointer;font-size:.86rem;color:var(--accent);font-weight:600}
details[open] summary{margin-bottom:8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.setrow:first-of-type{border-top:0}
.setrow .lbl{display:flex;flex-direction:column;gap:2px}
.setrow .lbl b{font-size:.92rem}
.setrow .ctl{display:flex;align-items:center;gap:8px;flex:none}
.setrow .ctl select,.setrow .ctl input{width:auto}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.login{max-width:420px;margin:20px auto 0;width:100%}
.err{color:var(--warn);font-size:.86rem}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.savebar .btn{border-color:transparent}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet .panel{background:var(--surface);color:var(--fg);border-radius:16px;padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{align-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px);text-align:center}
.skel{height:220px;border-radius:14px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%}
@media (prefers-reduced-motion: no-preference){.skel{animation:sk 1.4s linear infinite}.bar span{transition:width .3s ease}}
@keyframes sk{to{background-position:-200% 0}}
nav.tabs .ls{display:none}
.studyframe{display:block;width:100%;height:calc(100dvh - 250px);min-height:520px;border:1px solid var(--line);border-radius:14px;background:#fff}
/* 휴대폰: 탭을 화면 아래 고정 (앱처럼) */
@media (max-width:560px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;gap:2px;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{flex:1 1 0;min-width:0;padding:10px 2px;font-size:.8rem}
  nav.tabs .lf{display:none} nav.tabs .ls{display:inline}
  .studyframe{height:calc(100dvh - 230px - env(safe-area-inset-bottom,0px))}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .savebar{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">갓</div>
      <div><h1>우리집 갓생살기</h1><div class="sub" id="dateLabel"></div></div></div>
    <div class="who" id="who"></div>
  </header>
  <div class="demo" id="demoBanner" hidden><b>미리보기 모드</b> · 추천 스케줄과 예시 기록으로 보여 드리는 화면입니다. 눌러 보셔도 저장되지 않습니다.</div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="화면" hidden>
    <button role="tab" data-tab="today" aria-selected="true">오늘</button>
    <button role="tab" data-tab="week" aria-selected="false"><span class="lf">이번 주</span><span class="ls">주간</span></button>
    <button role="tab" data-tab="study" aria-selected="false">공부</button>
    <button role="tab" data-tab="together" aria-selected="false"><span class="lf">함께 보기</span><span class="ls">함께</span></button>
    <button role="tab" data-tab="edit" aria-selected="false"><span class="lf">내 스케줄</span><span class="ls">스케줄</span></button>
    <button role="tab" data-tab="alarm" aria-selected="false"><span class="lf">알림·설정</span><span class="ls">설정</span></button>
  </nav>
  <main id="main"><div class="skel" aria-label="불러오는 중"></div></main>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
const DAYS = ["일","월","화","수","목","금","토"];
const ORDER = [1,2,3,4,5,6,0];
const TYPES = {study:"공부", exercise:"운동", chores:"집안일", fixed:"고정 일정"};
const REASONS = ["야근","약속","집안일","컨디션","기타"];
const EVTYPES = ["야근","회식","약속","가족 행사","병원·장보기","기타"];
const LIGHT = ["야근","회식","약속"];
const W = [1,2,3,4,5];
const ALARM_DEFAULT = {blockOn:true, blockBefore:10, eveningOn:true, eveningAt:"22:00", sundayOn:true, sundayAt:"20:00"};
/* 공부 모듈: 프로필의 examKey로 연결. 같은 주소 아래 하위 페이지로 붙이면 로그인이 그대로 이어짐 */
const MODULES = {
  civil9: {name:"사복직 합격노트", who:"아내 · 9급 사회복지직", url:"https://sw9note-2f913ee331.netlify.app/", ready:true},
  elec:   {name:"전기기사 도우미", who:"남편 · 전기기사", url:"", ready:false}
};

/* ---------- 추천 스케줄 ---------- */
const TEMPLATES = {
  husband: {
    title: "남편 · 전기기사", who: "직장인, 야근 잦음",

const span = (a,b) => { let r = toMin(b) - toMin(a); if (r <= 0) r += 1440; return r; };
const hm = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; };

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; el.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return el;
}

function remote(key, fn){

    try { const r = await fn(); if (r && r.error) throw r.error; }
    catch (e) { console.error(e); toast(navigator.onLine ? "저장하지 못했습니다. 잠시 후 다시 눌러 주세요." : "오프라인이라 저장하지 못했습니다. 연결되면 다시 눌러 주세요."); }
  };
  queues[key] = (queues[key] || Promise.resolve()).then(run);
  return queues[key];
}

function dday(p){
  if (!p || !p.examDate) return null;
  const diff = Math.round((parseYmd(p.examDate) - today()) / 86400000);
  return diff > 0 ? `D-${diff}` : diff === 0 ? "D-DAY" : `D+${-diff}`;
}
function weekStats(id, p, ref){
  const ws = weekStart(ref); let done = 0, backlog = 0, planned = 0, exDays = 0; const reasons = {};
  for (let i = 0; i < 7; i++){
    const d = addDays(ws, i), key = ymd(d), day = dayDoc(id, key); let ex = false;
    for (const b of blocksOn(p, d)){
      const m = span(b.start, b.end), s = day.st && day.st[b.id];
      if (b.type === "study"){
        planned += m;
        if (s === "done") done += m;
        else if (s === "part"){ done += m/2; backlog += m/2; }
        else if (s === "skip") backlog += m;
      }
      if (b.type === "exercise" && (s === "done" || s === "part")) ex = true;
      if ((s === "skip" || s === "part") && day.why && day.why[b.id]) reasons[day.why[b.id]] = (reasons[day.why[b.id]]||0) + 1;
    }
    if (ex) exDays++;
  }
  const wk = (S.weeks[id] && S.weeks[id][ymd(ws)]) || {};
  const cleared = Math.min(wk.cleared || 0, backlog);
  return { done: done + cleared, backlog: backlog - cleared, cleared, planned, exDays, reasons };
}
function streak(id, p){
  let n = 0, d = today();
  for (let i = 0; i < 400; i++){
    const day = dayDoc(id, ymd(d));

    if (ok) n++; else if (i > 0) break;
    d = addDays(d, -1);
  }
  return n;
}

function timetable(blocks, o){
  o = o || {};
  const hr = o.compact ? 22 : 42;
  let h0 = 6, h1 = 23;
  for (const b of blocks){ const s = toMin(b.start), e = toMin(b.end); h0 = Math.min(h0, Math.floor(s/60)); if (e > s) h1 = Math.max(h1, Math.ceil(e/60)); }
  const inner = h("div", {class:"tt-in", style:`--hr:${hr}px;--hours:${h1-h0}`});
  inner.append(h("div", {class:"tt-corner"}));
  const tkey = ymd(today());
  ORDER.forEach((dow, i) => {
    const date = o.start ? addDays(o.start, i) : null, isT = date && ymd(date) === tkey;
    inner.append(h("div", {class:`tt-dh${isT ? " today" : ""}${dow === 0 ? " sun" : dow === 6 ? " sat" : ""}`}, h("b", null, DAYS[dow]), date ? h("span", null, `${date.getMonth()+1}/${date.getDate()}`) : null));
  });
  const times = h("div", {class:"tt-times"});
  for (let k = h0; k < h1; k += (o.compact ? 2 : 1)) times.append(h("span", {style:`top:${(k-h0)*hr}px`}, `${k}시`));
  inner.append(times);
  ORDER.forEach((dow, i) => {
    const date = o.start ? addDays(o.start, i) : null, isT = date && ymd(date) === tkey;
    const col = h("div", {class:`tt-col${isT ? " today" : ""}`});
    const list = blocks.filter(b => (b.days||[]).includes(dow));
    const place = (b, extra) => {
      const top = (toMin(b.start) - h0*60) / 60 * hr, ht = Math.max(o.compact ? 6 : 16, span(b.start, b.end) / 60 * hr - 2);
      const st = o.statusOf && date ? o.statusOf(b, date) : null;
      const clickable = o.onPick && (b.type !== "fixed" || o.editFixed);
      const name = b.label || TYPES[b.type];
      col.append(h(clickable ? "button" : "div", {class:`tb t-${b.type}${b.type === "fixed" ? " fx" : ""}${o.selected === b.id ? " sel" : ""}`,
        style:`top:${top}px;height:${ht}px;${extra || ""}`, "data-st": st || null, title:`${name} ${b.start}–${b.end}`,
        "aria-label": clickable ? `${DAYS[dow]}요일 ${b.start}–${b.end} ${name}${st ? " " + ({done:"완료",part:"일부",skip:"못함"}[st]) : ""}` : null,
        onclick: clickable ? () => o.onPick(b, date) : null},
        o.compact ? null : h("span", {class:"l"}, name),
        !o.compact && ht >= 36 && b.type !== "fixed" ? h("span", {class:"t"}, `${b.start}–${b.end}`) : null));
    };
    list.filter(b => b.type === "fixed").forEach(b => place(b));
    const act = list.filter(b => b.type !== "fixed").sort((a,b) => toMin(a.start) - toMin(b.start)), placed = [];
    for (const b of act){ const s = toMin(b.start), e = s + span(b.start, b.end), ov = placed.filter(p => p.s < e && s < p.e); let lane = 0; while (ov.some(p => p.lane === lane)) lane++; placed.push({b, s, e, lane}); }
    for (const p of placed){ const n = Math.max(...placed.filter(q => q.s < p.e && p.s < q.e).map(q => q.lane)) + 1; place(p.b, n > 1 ? `left:calc(${p.lane*100/n}% + 2px);width:calc(${100/n}% - 4px);` : ""); }
    if (isT){ const nm = nowMin(); if (nm >= h0*60 && nm <= h1*60) col.append(h("div", {class:"nowline", style:`top:${(nm - h0*60)/60*hr}px`})); }
    inner.append(col);
  });
  return h("div", {class:"tt"}, inner);
}

const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function b64ToU8(s){ const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function refreshPushState(){
  try { const reg = pushSupported() && await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); S.pushOn = !!sub; } catch { S.pushOn = false; }

async function enablePush(){
  if (!pushSupported()) return toast(isIOS ? "아이폰은 홈 화면에 추가한 앱에서만 알림을 켤 수 있습니다." : "이 브라우저는 알림을 지원하지 않습니다.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("알림이 허용되지 않았습니다. 휴대폰 설정에서 이 앱의 알림을 켜 주세요.");
  try {
    const reg = await navigator.serviceWorker.ready;
    const {data, error} = await S.sb.functions.invoke("notify", {body:{action:"vapid"}});
    if (error || !data || !data.publicKey) throw error || new Error("no key");
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToU8(data.publicKey)});
    const j = sub.toJSON();
    const r = await S.sb.from("push_subs").upsert({user_id: S.uid, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ua: navigator.userAgent.slice(0,200)}, {onConflict: "endpoint"});
    if (r.error) throw r.error;
    S.pushOn = true; render(false, true); toast("이 기기에서 알림을 켰습니다");
  } catch (e) { console.error(e); toast("알림을 켜지 못했습니다. 잠시 후 다시 시도해 주세요."); }
}
async function disablePush(){

  if (!isStandalone() && S.mode === "live") w.append(h("button", {class:"btn small primary", onclick: doInstall}, "앱 설치"));
  document.getElementById("demoBanner").hidden = S.mode !== "demo";
  document.getElementById("tabs").hidden = !(S.mode === "live" || S.mode === "demo");
}
function render(fromData, force){
  if (fromData && S.tab === "edit" && S.draft && !force) return;
  header();
  const main = document.getElementById("main");
  if (S.mode === "loading") return;
  if (S.mode === "login") return main.replaceChildren(loginView());
  if (S.mode === "nolib") return main.replaceChildren(h("div", {class:"empty"}, "인터넷에 연결되어 있지 않아 불러오지 못했습니다. 연결 후 다시 열어 주세요."));
  if (S.tab === "study" && fromData && document.getElementById("studyFrame")) return;   // 공부 중엔 데이터 갱신으로 화면을 다시 그리지 않음 (풀던 문제 유지)
  main.replaceChildren(S.tab === "today" ? todayView() : S.tab === "week" ? weekView() : S.tab === "study" ? studyView() : S.tab === "together" ? togetherView() : S.tab === "edit" ? editView() : alarmView());
}
function setTab(t){
  if (S.tab === "edit" && t !== "edit" && S.dirty) toast("편집 중인 변경은 '내 스케줄'에 그대로 남아 있습니다");
  S.tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  render(false, true); window.scrollTo({top:0});
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
{ const ht = (location.hash || "").slice(1); if (["today","week","study","together","edit","alarm"].includes(ht)){ S.tab = ht; document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ht))); } }
const td = today(); document.getElementById("dateLabel").textContent = `${td.getFullYear()}년 ${td.getMonth()+1}월 ${td.getDate()}일 ${DAYS[td.getDay()]}요일`;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; header(); });
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.mode === "live"){ scheduleReload(); } });

/* ---------- 미리보기(데모) ---------- */
function startDemo(){
  S.mode = "demo"; S.uid = "demo-me"; S.canWrite = true;
  S.people = {"demo-me": fromTpl("husband"), "demo-wife": fromTpl("wife")};
  const ws = weekStart(today()), tk = ymd(today());
  for (const [id, p] of Object.entries(S.people)){
    S.days[id] = {};
    for (let i = 0; i < 7; i++){
      const d = addDays(ws, i), key = ymd(d); if (key >= tk) break;
      const cur = {date:key, st:{}, why:{}};
      blocksOn(p, d).filter(tracked).forEach((b, j) => {
        if (b.type === "chores"){ cur.st[b.id] = "done"; return; }
        if (id === "demo-me" && d.getDay() === 2 && b.start === "20:30"){ cur.st[b.id] = "skip"; cur.why[b.id] = "야근"; cur.mode = "min"; cur.minStudy = true; return; }
        if ((i + j) % 6 === 3){ cur.st[b.id] = "part"; cur.why[b.id] = id === "demo-me" ? "컨디션" : "집안일"; return; }
        cur.st[b.id] = "done";
      });
      S.days[id][key] = cur;
    }
  }
  const thu = ymd(addDays(ws, 3)), sun = ymd(addDays(ws, 6));
  S.family = [
    {id:"e1", date: thu >= tk ? thu : ymd(addDays(ws, 10)), who:"demo-me", type:"회식", time:"18:30~", memo:"팀 회식"},
    {id:"e2", date: sun, who:"all", type:"가족 행사", time:"12:00", memo:"부모님 댁 점심"},
    {id:"e3", date: ymd(addDays(ws, 8)), who:"demo-wife", type:"병원·장보기", time:"10:00", memo:"정기 검진"}
  ];
  render(false, true);
}

/* ---------- 시작 ---------- */
async function startLive(user){
  S.uid = user.id; S.email = user.email || ""; S.canWrite = true; S.mode = "loading"; render(false, true);
  try { await loadAll(); } catch (e) { console.error(e); toast("불러오지 못했습니다. 새로고침해 주세요."); }
  S.mode = "live"; render(false, true);
  S.sb.channel("household")
    .on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, scheduleReload)
    .on("postgres_changes", {event:"*", schema:"public", table:"sch_days"}, scheduleReload)
    .on("postgres_changes", {event:"*", schema:"public", table:"sch_weeks"}, scheduleReload)
    .on("postgres_changes", {event:"*", schema:"public", table:"sch_family"}, scheduleReload)
    .subscribe();
  refreshPushState();
}
(async () => {
  const wantDemo = /[?&]demo\b/.test(location.search) || !CFG.supabaseUrl || !CFG.supabaseAnonKey;
  if (wantDemo){ if (window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey) S.sb = true; return startDemo(); }
  if (!window.supabase){ S.mode = "nolib"; return render(false, true); }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const {data: {session}} = await S.sb.auth.getSession();
  if (!session){ S.mode = "login"; render(false, true); }
  else await startLive(session.user);
  S.sb.auth.onAuthStateChange((ev, ses) => { if (ev === "SIGNED_OUT") location.reload(); });
})();
})();
</script>
